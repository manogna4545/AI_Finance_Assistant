services:
  - type: web
    name: ai-finance-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app"
    rootDir: backend
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-finance-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://ai-finance-assistant-frontend-plum.vercel.app

databases:
  - name: ai-finance-db
    databaseName: finance_assistant
    user: finance_user
    plan: free
